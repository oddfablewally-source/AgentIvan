name: Test

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AgentIvan verification suite
        env:
          IVAN_DIR: ${{ github.workspace }}\ivan-core-brick
          IVAN_BASELINE: ${{ github.workspace }}\ivan_baseline.sha256
        run: |
          python agent-ivan\scripts\verify.py

      - name: Run Brick 11 Windows workflow
        run: |
          python ivan_b11_workflow.py
