name: Windows Verify

on:
  workflow_dispatch:

jobs:
  windows-verify:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run AgentIvan verification suite
        env:
          IVAN_DIR: ${{ github.workspace }}\ivan-core-brick
          IVAN_BASELINE: ${{ github.workspace }}\ivan_baseline.sha256
        run: |
          python agent-ivan\scripts\verify.py

      - name: Run Brick 11 Windows workflow
        run: |
          python ivan_b11_workflow.py
