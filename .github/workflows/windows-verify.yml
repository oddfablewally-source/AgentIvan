name: Windows Verify

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Discover repository
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Extension -in ".py", ".toml", ".yml", ".yaml"
            } |
            Select-Object FullName

      - name: Run pytest
        shell: pwsh
        run: |
          python -m pytest
