name: Windows Verify

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  windows-verify:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract AgentIvan verification package
        shell: powershell
        run: |
          Expand-Archive `
            -LiteralPath "agent-ivan-b11-windows-verify (1).zip" `
            -DestinationPath "." `
            -Force

      - name: Run AgentIvan verification gate
        shell: cmd
        env:
          IVAN_DIR: ${{ github.workspace }}\ivan-core-brick
          IVAN_BASELINE: ${{ github.workspace }}\ivan_baseline.sha256
        run: |
          python agent-ivan\scripts\verify.py

      - name: Run Brick 11 Windows workflow
        shell: cmd
        run: |
          agent-ivan\.venv\Scripts\python.exe ivan_b11_workflow.py
