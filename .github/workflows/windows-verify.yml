name: Windows Verify

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  windows-verify:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find and extract AgentIvan verification package
        shell: powershell
        run: |
          $archives = @(Get-ChildItem -Path "." -File -Filter "*.zip")

          if ($archives.Count -ne 1) {
            Write-Error "Expected exactly one ZIP archive in the repository root, found $($archives.Count)."
            $archives | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          $archive = $archives[0].FullName

          Write-Host "Extracting: $archive"

          Expand-Archive `
            -LiteralPath $archive `
            -DestinationPath "." `
            -Force

      - name: Run AgentIvan verification gate
        shell: cmd
        env:
          IVAN_DIR: ${{ github.workspace }}\ivan-core-brick
          IVAN_BASELINE: ${{ github.workspace }}\ivan_baseline.sha256
        run: |
          python agent-ivan\scripts\verify.py

      - name: Run Brick 11 Windows workflow
        shell: cmd
        run: |
          agent-ivan\.venv\Scripts\python.exe ivan_b11_workflow.py
